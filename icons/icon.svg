<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc8f5" />
      <stop offset="1" stop-color="#0b8fd6" />
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd67a" />
      <stop offset="1" stop-color="#12924a" />
    </linearGradient>
    <clipPath id="tile">
      <rect width="128" height="128" rx="30" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#sky)" />
    <!-- the curve of the Earth -->
    <circle cx="64" cy="218" r="140" fill="url(#land)" />
  </g>
  <!-- "12" -->
  <g fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 34 L45 22 V68" />
    <path d="M67 37 A16 16 0 1 1 95 48 L67 68 H99" />
  </g>
  <!-- "000" -->
  <g fill="none" stroke="#ffffff" stroke-width="6.5">
    <circle cx="37" cy="103" r="8" />
    <circle cx="64" cy="101" r="8" />
    <circle cx="91" cy="103" r="8" />
  </g>
</svg>
