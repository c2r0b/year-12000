<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Context</title>
  </head>
  <body>
    <p><b>since</b> <span id="after-word">1500</span></p>
    <p><span>Nov 16,</span> <span id="after-month">1500</span></p>
    <p><span id="range-start">1500</span>–<span id="range-end">1600</span></p>
    <p>The <a href="#"><em id="nested">1850</em></a> was a strange year.</p>

    <p><span id="before-unit">2026</span> <em>people</em></p>
    <p><span>$</span><span id="after-currency">2026</span></p>
    <p>about <strong id="after-about">2026</strong></p>
    <p>Room <span id="after-label">2026</span></p>

    <div>
      <div>since</div>
      <div id="other-block">1500</div>
    </div>
    <p>since<br /><span id="other-line">1500</span></p>

    <table id="columns">
      <thead>
        <tr><th>Name</th><th>Year</th><th>Price</th></tr>
      </thead>
      <tbody>
        <tr><td>Alpha</td><td id="column-year">1500</td><td id="column-price">2026</td></tr>
        <tr><td>Beta</td><td id="column-year-2">1066</td><td id="column-price-2">in 1999</td></tr>
      </tbody>
    </table>

    <table id="rows">
      <tr><th>Founded</th><td id="row-year">1088</td></tr>
      <tr><th>Population</th><td id="row-quantity">2019</td></tr>
      <tr><th>Motto</th><td id="row-neutral">1500</td></tr>
    </table>

    <table id="plain">
      <tr><td id="plain-old">1500</td><td id="plain-recent">2026</td></tr>
    </table>

    <p id="decades">Music of the 1990s, mid-2020 trends and pre-1900 houses.</p>
    <p id="done">© 2026</p>
  </body>
</html>
